<html lang="zh-CN">
	<head>
		<meta charset="UTF-8">
		<title>平安丝路</title>
		<style>
			body { 
				font-family: sans-serif; 
				max-width: 1500px; 
				margin: 10px auto;
				padding: 10px; 
				background-color: #f5f5f5; 
			} 
			.control-panel { 
				background:white; 
				padding: 10px; 
				border-radius: 8px; 
				box-shadow: 0 2px 8px rgba(0,0,0,0.1);
				margin-bottom: 20px; 
			} 
			label { 
				font-weight: bold; 
				color: #333; 
			} 
			input[type="text"]{ 
				padding: 10px; 
				border: 1px solid #ccc; 
				border-radius: 4px; 
				box-sizing:border-box; 
				font-size: 16px; 
				margin-top: 5px; 
					margin-bottom: 5px; 
			} 
			.full-width{ width: 25%; } 
			.row > div { flex: 1; } 
			.row input { width: 100%; } 
			.canvas-container{ 
				background: white; 
				padding: 15px; 
				border-radius: 8px; 
				box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
				display: flex; 
				justify-content: center; 
				align-items:center; 
				min-height: 200px; 
			} 
			canvas { 
				max-width: 100%; 
				border: 1px dashed #ccc; 
			} 
			button { 
				background-color: #1677ff; 
				color: white; 
				border: none;
				padding: 10px 20px; 
				border-radius: 4px; 
				cursor: pointer; 
				font-size: 16px;
				margin-right: 10px; 
				} 
			button:disabled { 
				background-color: #a0c4ff; 
				cursor:not-allowed; 
			} 
			.button-container input[type="file"] { display: none; }
			.uploadbtn { 
				display: inline-block; 
				padding: 10px 20px; 
				background-color:#1677ff; 
				color: white; 
				font-size: 16px; 
				border-radius: 4px; 
				cursor: pointer;
				margin-right: 10px; 
			} 
			.uploadbtn:hover { background-color: #2980b9; }
		</style>
	</head>
	<body>
		<div class="control-panel">
			<div class="control-group">
				<label for="nameInput">姓名:</label>
				<input type="text" id="nameInput" class="full-width" maxlength="16" placeholder="张三" value="张三">
				<label for="dateInput">&emsp;日期:</label>
				<input type="text" id="dateInput" class="full-width" maxlength="16" placeholder="2026年8月17日" value="2026年8月17日">
				<label for="partInput">&emsp;期数:</label>
				<input type="text" id="partInput" class="full-width" maxlength="16" placeholder="二十四" value="二十四">
				<br>
				<label for="lessonInput">课程:</label>
				<input type="text" id="lessonInput" class="full-width" maxlength="16" placeholder="建设安全保障" value="建设安全保障">
				<label for="certnoInput">&emsp;编号:</label>
				<input type="text" id="certnoInput" class="full-width" maxlength="16" placeholder="PASLJY202608" value="PASLJY202608">
				&emsp;&emsp;&emsp;
				<span class="button-container" display: inline-block>
					<label for="upload" class="uploadbtn">选择文件</label>
					<input type="file" id="upload" accept="image/*">
					<button id="exportBtn" disabled>保存图片</button>
				</span>
			</div>
		</div>
		<div class="canvas-container">
			<canvas id="myCanvas" width="1500px" height="1050px"></canvas>
		</div>
		<script>
			const upload = document.getElementById('upload');
			const canvas = document.getElementById('myCanvas');
			const ctx = canvas.getContext('2d');
			const nameInput = document.getElementById('nameInput');
			const dateInput = document.getElementById('dateInput');
			const partInput = document.getElementById('partInput');
			const lessonInput = document.getElementById('lessonInput');
			const certnoInput = document.getElementById('certnoInput');
			upload.addEventListener('change',function(e) {
				const file = e.target.files[0];
				if (!file) return;
				const reader = new FileReader();
				reader.onload = function(event) {
					const img = new Image();
					img.onload = function() {
						ctx.clearRect(0, 0, canvas.width, canvas.height);
						ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
						currentImage = img;
						exportBtn.disabled = false;
						renderCanvas();
					};
					img.src = event.target.result;
				};
				reader.readAsDataURL(file);
			});
			[nameInput, dateInput, partInput, lessonInput, certnoInput].forEach(input => {
				input.addEventListener('input', function() {
					if (currentImage) renderCanvas();
				});
			});
			function renderCanvas() {
				if (!currentImage) return;
				canvas.width = currentImage.naturalWidth;
				canvas.height = currentImage.naturalHeight;
				ctx.clearRect(0, 0, canvas.width, canvas.height);
				ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
				const fontSize = 61;
				const marginleft=210.7;
				const name = nameInput.value.trim() || "张三";
				const date = dateInput.value.trim() || "2026年8月17日";
				ctx.font = ` ${fontSize}px "微软雅黑", sans-serif`;
				ctx.letterSpacing = "2.35px";
				ctx.fillStyle = '#333333';
				ctx.fillText(name + "于" + date + "在本网学习", marginleft, 447.5);
				const part = partInput.value.trim() || "二十四";
				const lesson = lessonInput.value.trim() || "建设安全保障";
				ctx.letterSpacing = "2.38px";
				ctx.fillStyle = '#a8021a';
				ctx.fillText("第"+part+"期“一带一路”"+lesson, marginleft, 539.5);
				ctx.letterSpacing = "2.35px";
				ctx.fillStyle = '#a8021a';
				ctx.fillText("线上培训班", marginleft, 631);
				ctx.fillStyle = '#333333';
				ctx.fillText("课程，学习期满，考核合", 528, 631);
				ctx.fillText("格，准予毕业。", marginleft, 723);
				const certno = certnoInput.value.trim() || "PASLJY202608";
				ctx.font = ` 55px "微软雅黑", sans-serif`;
				ctx.letterSpacing = "0px";
				ctx.fillStyle = '#a6a6a6';
				ctx.fillText("证字第号: " + certno, 237, 946.5);
			};
			exportBtn.addEventListener('click',function() {
				const dataURL = canvas.toDataURL('image/png');
				const link = document.createElement('a');
				link.download = nameInput.value + '.png';
				link.href = dataURL;
				link.click();
			});
		</script>
	</body>
</html>
